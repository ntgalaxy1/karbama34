name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v10.0.1 (must match app versionName)"
        required: true
        type: string
      dry_run:
        description: "Build and test only; do not create or modify a Release"
        required: false
        default: false
        type: boolean

# The workflow receives no broader permissions than needed to create a tag/release
# and upload the APK to this repository.
permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, test, and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out the exact release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore Firebase configuration and permanent release signer
        env:
          KARBAMA_GOOGLE_SERVICES_JSON_B64: ${{ secrets.KARBAMA_GOOGLE_SERVICES_JSON_B64 }}
          KARBAMA_RELEASE_KEYSTORE_B64: ${{ secrets.KARBAMA_RELEASE_KEYSTORE_B64 }}
          KARBAMA_RELEASE_STORE_PASSWORD: ${{ secrets.KARBAMA_RELEASE_STORE_PASSWORD }}
          KARBAMA_RELEASE_KEY_ALIAS: ${{ secrets.KARBAMA_RELEASE_KEY_ALIAS }}
          KARBAMA_RELEASE_KEY_PASSWORD: ${{ secrets.KARBAMA_RELEASE_KEY_PASSWORD }}
          KARBAMA_RELEASE_CERT_SHA256: ${{ vars.KARBAMA_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KARBAMA_GOOGLE_SERVICES_JSON_B64" && test -n "$KARBAMA_RELEASE_KEYSTORE_B64" && test -n "$KARBAMA_RELEASE_STORE_PASSWORD" && test -n "$KARBAMA_RELEASE_KEY_ALIAS" && test -n "$KARBAMA_RELEASE_KEY_PASSWORD" && test -n "$KARBAMA_RELEASE_CERT_SHA256" || { echo "Missing release configuration."; exit 1; }
          printf '%s' "$KARBAMA_GOOGLE_SERVICES_JSON_B64" | base64 --decode > Karbama/app/google-services.json
          printf '%s' "$KARBAMA_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/karbama-release.jks"
          actual="$(keytool -list -v -keystore "$RUNNER_TEMP/karbama-release.jks" -storepass "$KARBAMA_RELEASE_STORE_PASSWORD" -alias "$KARBAMA_RELEASE_KEY_ALIAS" 2>/dev/null | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          expected="$(printf '%s' "$KARBAMA_RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test -n "$actual" && test "$actual" = "$expected" || { echo "Release keystore fingerprint mismatch."; exit 1; }

      - name: Confirm tag and Android version match
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like v52.0.4"; exit 1; }
          APP_VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Karbama/app/build.gradle.kts | head -n 1)"
          test -n "$APP_VERSION" || { echo "versionName was not found."; exit 1; }
          test "v$APP_VERSION" = "$RELEASE_TAG" || {
            echo "Tag $RELEASE_TAG does not match Android versionName $APP_VERSION."
            exit 1
          }

      - name: Test and build APK
        working-directory: Karbama
        env:
          JAVA_TOOL_OPTIONS: -Dkbshots.dir=${{ github.workspace }}/kb-tools/shots
          KARBAMA_RELEASE_STORE_PASSWORD: ${{ secrets.KARBAMA_RELEASE_STORE_PASSWORD }}
          KARBAMA_RELEASE_KEY_ALIAS: ${{ secrets.KARBAMA_RELEASE_KEY_ALIAS }}
          KARBAMA_RELEASE_KEY_PASSWORD: ${{ secrets.KARBAMA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p "$GITHUB_WORKSPACE/kb-tools/shots"
          # R8 minification needs more heap than the deliberately small local
          # developer default. Keep this runner-only so constrained local tests
          # remain predictable while signed release builds complete reliably.
          ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseG1GC -Dfile.encoding=UTF-8" \
            -Pkbshots testDebugUnitTest assembleRelease \
            -Pkarbama.release.storeFile="$RUNNER_TEMP/karbama-release.jks" \
            -Pkarbama.release.storePassword="$KARBAMA_RELEASE_STORE_PASSWORD" \
            -Pkarbama.release.keyAlias="$KARBAMA_RELEASE_KEY_ALIAS" \
            -Pkarbama.release.keyPassword="$KARBAMA_RELEASE_KEY_PASSWORD"

      - name: Prepare and verify permanent release asset
        id: asset
        run: |
          set -euo pipefail
          APK="Karbama/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "APK was not produced."; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER" || { echo "apksigner was not found."; exit 1; }
          # The restored keystore/alias was fingerprint-checked against the expected
          # permanent certificate before Gradle ran. Here apksigner verifies that the
          # emitted APK has a valid signature; parsing its human-oriented output again
          # was brittle across Android build-tools releases.
          "$APKSIGNER" verify --verbose --print-certs "$APK" >/dev/null
          mkdir -p release
          ASSET="release/Karbama-${RELEASE_TAG}.apk"
          cp "$APK" "$ASSET"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$ASSET" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$ASSET" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -c '%s' "$ASSET")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.asset.outputs.asset }}
          MD5: ${{ steps.asset.outputs.md5 }}
          SHA256: ${{ steps.asset.outputs.sha256 }}
          BYTES: ${{ steps.asset.outputs.bytes }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $RELEASE_TAG already exists; it will not be overwritten."
            exit 1
          fi
          cat > release-notes.md <<EOF
          ## Android APK

          - Package: com.karbama.app
          - Version: ${RELEASE_TAG#v}
          - Size: ${BYTES} bytes
          - MD5: ${MD5}
          - SHA-256: ${SHA256}

          This APK was built and unit-tested by GitHub Actions from the tagged source.
          EOF
          gh release create "$RELEASE_TAG" "$ASSET#Karbama-${RELEASE_TAG}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Karbama $RELEASE_TAG" \
            --notes-file release-notes.md \
            --latest
