<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کارباما | Karbama — دموی اپلیکیشن کاریابی ترکیه</title>
<style>
/* #33: پایه‌ی یک‌دست کنترل‌ها — فونت و اندازه‌ی همه‌ی دکمه‌ها/فیلدها یکی است */
button, input, select, textarea{ font-family:var(--ff); font-size:14px; line-height:1.5; color:var(--ink); }
button{ padding:0; }
.iconbtn, .heart-btn, .pw-eye, .fab{ padding:0; }
.kb-credit{ font-size:11px; color:rgba(95,117,135,.72); }
input::placeholder, textarea::placeholder{ color:#57697A; opacity:1; }
input:not([type=range]):not([type=checkbox]):not([type=radio]), textarea, select{ padding:12px 16px; }
input[type=range], input[type=checkbox], input[type=radio]{ padding:0; }
/* ============ THEME — تنها منبع رنگ/فونت/فاصله (دیزاین v4) ============ */
/* ============ THEME — تنها منبع رنگ/فونت/فاصله (دیزاین v4) ============ */
/* ============ THEME — تنها منبع رنگ/فونت/فاصله (دیزاین v4) ============ */
:root{
  /* --- رنگ‌های پایه --- */
  --brand:#0E9F8E; --brand-d:#066F6B; --brand-deep:#0A7F91; --brand-l:#E6F7F4;
  --accent:#F59E0B; --accent-l:#FFF4DE;
  --ink:#0F1F2B; --ink2:#3F5566; --ink3:#57697A;      /* همه ≥ ۴.۵:۱ کنتراست */
  --bg:#ECF3F6; --card:#FFFFFF; --line:#E3ECF0;
  --danger:#E5484D; --ok:#12A150; --purple:#7C5CFF;
  --violet:#7C5CFF; --violet-d:#5B3FE0; --violet-l:#EEEBFF;
  --coral:#FF7A59; --coral-d:#E4562F; --coral-l:#FFEDE7;
  --sun:#FFB020; --sun-d:#F59E0B; --sun-l:#FFF4DE;
  --mint:#2FD6A8; --mint-l:#E2FBF3;
  /* --- گرادیان‌ها --- */
  --grad-brand:linear-gradient(135deg,#0E9F8E 0%,#0A8E8C 45%,#0A7F91 100%);
  --brand-g:var(--grad-brand);
  --brand-g2:linear-gradient(170deg,#0E9F8E,#0A7F91 60%,#066F6B);
  --accent-g:linear-gradient(180deg,#FFB020,#F59E0B);
  --grad-violet:linear-gradient(135deg,#7C5CFF,#5B3FE0);
  --grad-coral:linear-gradient(135deg,#FF7A59,#E4562F);
  --grad-sun:linear-gradient(135deg,#FFB020,#F59E0B);
  --grad-mint:linear-gradient(135deg,#2FD6A8,#19CBAD);
  /* --- شیشه (glassmorphism) --- */
  --glass-1:linear-gradient(150deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,.62) 100%);
  --glass-2:linear-gradient(150deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,.5) 100%);
  --glass-line:rgba(255,255,255,.75);
  /* --- سایه‌ها: سه سطح + درخشش رنگی --- */
  --sh:0 1px 2px rgba(12,38,50,.05), 0 10px 26px -10px rgba(12,38,50,.16);
  --sh2:0 2px 4px rgba(12,38,50,.05), 0 14px 30px -12px rgba(12,38,50,.18);
  --sh3:0 22px 48px -22px rgba(6,52,60,.38);
  --sh-brand:0 14px 28px -14px rgba(16,179,159,.6);
  --sh-sun:0 14px 28px -14px rgba(245,158,11,.55);
  --sh-danger:0 14px 28px -14px rgba(229,72,77,.45);
  --glass-shadow:var(--sh2);
  --glow:var(--sh-brand);
  --ring:0 0 0 4px rgba(16,179,159,.16);
  /* --- گردی گوشه --- */
  --r:16px; --r2:20px; --r3:24px;
  /* --- شبکه‌ی فاصله (۴ پیکسلی) --- */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  /* --- فونت --- */
  --ff:"Vazirmatn","Segoe UI",Tahoma,"Iranian Sans",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{margin:0}
body{
  margin:0;
  font-family:var(--ff); background:
    radial-gradient(1200px 600px at 15% -10%, #D6F2EC 0%, transparent 60%),
    radial-gradient(900px 500px at 90% 110%, #FFF4DE 0%, transparent 55%),
    #E3ECF0;
  color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  flex-direction:column;
  /* هیچ ارتفاعی به ۱۰۰٪ یا vh وابسته نیست تا در پیش‌نمایش هم درست بیاید */
  padding:24px 16px; box-sizing:border-box; min-height:660px;
}
/* ============ PHONE SHELL ============ */
.phone{
  width:100%; max-width:432px;
  height:800px;          /* ارتفاع مطمئن و ثابت */
  max-height:88vh;       /* اگر vh معتبر بود، جا می‌شود */
  min-height:620px;      /* و هرگز کوچک‌تر/صفر نمی‌شود */
  background:var(--card); border-radius:38px; position:relative;
  box-shadow:0 40px 90px -20px rgba(15,31,43,0.42), 0 0 0 10px #101C24, 0 0 0 12px #2B3D48;
  display:flex; flex-direction:column; overflow:hidden;
}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:104px;height:22px;background:#101C24;border-radius:20px;z-index:60}
.statusbar{
  height:40px; flex:0 0 40px; display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; font-size:12px; font-weight:700; color:var(--ink); background:var(--card); z-index:50; letter-spacing:0.4px;
}
.statusbar .right{display:flex;gap:4px;align-items:center}
.bar{display:inline-block;width:3px;background:var(--ink);border-radius:8px}
.shell{flex:1; min-height:0; display:flex; flex-direction:column; position:relative; background:var(--bg)}
#view{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin}
#view::-webkit-scrollbar{width:0}
#tabbar{flex:0 0 auto}
.hidden{display:none !important}

/* ============ BITS ============ */
.btn{
  border:0; border-radius:16px; padding:16px 16px; font-family:inherit; font-size:15px; font-weight:800;
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .12s ease, filter .15s ease, box-shadow .15s; width:100%;
}
.btn:active{transform:scale(.975)}
.btn-primary{background:linear-gradient(180deg,var(--brand) 0%,var(--brand-d) 100%); color:#FFFFFF; box-shadow:var(--sh-brand)}
.btn-accent{background:linear-gradient(180deg,#FFB020,#F59E0B); color:#5A3D06; box-shadow:var(--sh-sun)}
.btn-dark{background:var(--ink); color:#FFFFFF}
.btn-ghost{background:#FFFFFF; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-danger{background:#FEF0F0; color:var(--danger); box-shadow:inset 0 0 0 1.5px #FEF0F0}
.btn-sm{padding:8px 12px; font-size:13px; border-radius:12px; width:auto}
.btn[disabled]{opacity:.45; pointer-events:none}

/* ============ عکس و ویدیوی آگهی ============ */
.mstrip{display:flex;align-items:center;gap:8px;margin-top:12px}
.job:has(.cover) .mstrip{display:none}   /* کاور بالای کارت، جای نوار بندانگشتی را می‌گیرد */
.mthumb{position:relative;width:58px;height:58px;flex:0 0 58px;border-radius:12px;overflow:hidden;background:#E3ECF0;cursor:pointer;display:block}
.mthumb.lg{width:104px;height:104px;flex:0 0 104px;border-radius:16px}
.mthumb img{width:100%;height:100%;object-fit:cover;display:block}
.mthumb:active{transform:scale(.96)}
.mthumb .mplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;color:#FFFFFF;font-size:16px;background:rgba(15,31,43,0.3)}
.mthumb .mdel{position:absolute;top:4px;inset-inline-end:4px;width:22px;height:22px;border-radius:50%;background:#E5484D;color:#FFFFFF;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.mthumb.mmore{display:flex;align-items:center;justify-content:center;background:#ECF3F6;color:#3F5566;font-weight:900;font-size:13px}
.mcount{font-size:11px;font-weight:800;color:#57697A;margin-inline-start:auto}
.mgallery{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
/* ============ نمایش تمام‌صفحه ============ */
#viewer.vw-open{position:fixed;inset:0;z-index:99;background:#0F1F2B;display:flex;align-items:center;justify-content:center}
.vw-top{position:absolute;top:0;inset-inline:0;display:flex;align-items:center;gap:8px;padding:12px 16px;color:#FFFFFF;z-index:2}
.vw-x{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,0.16);color:#FFFFFF;font-size:16px;cursor:pointer}
.vw-ttl{flex:1;font-size:13px;font-weight:900;line-height:1.6}
.vw-ttl span{display:block;font-size:11px;font-weight:700;opacity:.7}
.vw-count{background:rgba(255,255,255,0.16);border-radius:20px;padding:8px 12px;font-size:12px;font-weight:800}
.vw-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.vw-img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .08s linear;cursor:zoom-in}
.vw-video{max-width:100%;max-height:100%;background:#0F1F2B}
.vw-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,0.16);color:#FFFFFF;font-size:22px;cursor:pointer;z-index:2}
.vw-nav.prev{inset-inline-start:10px} .vw-nav.next{inset-inline-end:10px}
.vw-hint{position:absolute;bottom:16px;inset-inline:0;text-align:center;color:rgba(255,255,255,0.75);font-size:12px;line-height:1.9;padding:0 20px}
.row{display:flex; gap:8px}
.card{background:var(--card); border-radius:var(--r2); box-shadow:var(--sh2); padding:16px; border:1px solid #E3ECF0}
.card + .card{margin-top:12px}
/* ردیف‌های «ارتباط با ما»: کل ردیف یک لینک است */
.contact-row{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;cursor:pointer}
.contact-row:active{transform:scale(.985)}
.muted{color:var(--ink3)}
.small{font-size:13px}
.pad{padding:0 16px}
.gap{height:14px}
.err{color:var(--danger); font-size:12px; font-weight:700; margin-top:4px}
.hr{height:1px;background:var(--line);margin:16px 0}
.center{text-align:center}
h1,h2,h3,h4{margin:0; line-height:1.5}
.sec-title{font-size:13px; font-weight:900; color:var(--ink2); letter-spacing:0.2px; display:flex; align-items:center; gap:8px; margin:0 0 8px}
.sec-title .dot{width:7px;height:7px;border-radius:50%;background:var(--brand)}

/* ============ APP BAR ============ */
.appbar{
  position:sticky; top:0; z-index:30; background:var(--card); border-bottom:1px solid var(--line);
  padding:12px 16px; display:flex; align-items:center; gap:12px;
}
.appbar.teal{background:linear-gradient(135deg,#088080,#0A7F91 55%,#0A7F91); border:0; color:#FFFFFF}
.appbar h3{font-size:16px; font-weight:900; flex:1; min-width:0}
.iconbtn{
  width:38px;height:38px;flex:0 0 38px;border-radius:12px;border:0;background:#F6FAFB;color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px; font-family:inherit; font-weight:800
}
.appbar.teal .iconbtn{background:rgba(255,255,255,0.16); color:#FFFFFF}
.iconbtn:active{transform:scale(.94)}

/* ============ FORM ============ */
.field{margin-bottom:12px}
.field > label{display:block;font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:8px}
.field > label .req{color:var(--danger)}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%; font-family:inherit; font-size:14px; font-weight:600; color:var(--ink);
  background:#F6FAFB; border:1px solid #E3ECF0; border-radius:12px; padding:12px 12px; outline:none;
  transition:border-color .15s, background .15s; appearance:none;
}
textarea{min-height:88px; resize:vertical; line-height:1.7; font-weight:500}
input:focus,select:focus,textarea:focus{border-color:var(--brand); background:#FFFFFF}
input::placeholder,textarea::placeholder{color:#57697A; font-weight:500}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
  background-position:calc(0% + 16px) 50%,calc(0% + 21px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-inline-start:34px}
html[dir=rtl] select{background-position:calc(100% - 16px) 50%,calc(100% - 21px) 50%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid #E3ECF0; background:#F6FAFB; color:var(--ink2); border-radius:12px;
  padding:8px 12px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; transition:.15s
}
.chip.on{background:var(--brand-l); border-color:var(--brand); color:var(--brand-d); box-shadow:var(--sh-brand)}
.chip:active{transform:scale(.96)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{white-space:nowrap;flex:0 0 auto}

/* level slider */
.range{width:100%;accent-color:var(--brand);height:26px}
.cc-badge{
  flex:0 0 66px; height:47px; display:flex; align-items:center; justify-content:center;
  background:#F6FAFB; border:1px solid #D6F2EC; border-radius:12px;
  font-weight:900; font-size:14px; color:var(--brand-d); letter-spacing:0.4px
}
.phone-input{flex:1; min-width:0}
.levelbox{display:flex;align-items:center;gap:12px}
.levelval{
  min-width:74px;text-align:center;background:var(--brand-l);color:var(--brand-d);font-weight:900;font-size:14px;
  border-radius:12px;padding:8px 8px
}
.leveldesc{font-size:13px;font-weight:800;color:var(--ink2)}

/* photo upload */
.uploads{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.upload{
  border:2px dashed #E3ECF0; border-radius:var(--r); background:#F6FAFB; min-height:150px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  text-align:center; padding:12px 8px; position:relative; overflow:hidden; transition:.18s
}
.upload:hover{border-color:var(--brand); background:var(--brand-l)}
.upload.filled{border-style:solid; border-color:var(--brand); padding:0}
.upload img{width:100%;height:100%;min-height:150px;object-fit:cover;display:block}
.upload .tag{position:absolute;top:7px;inset-inline-start:7px;background:var(--ok);color:#FFFFFF;font-size:11px;font-weight:900;padding:4px 8px;border-radius:8px;z-index:2}
.upload .cap{font-size:12px;font-weight:800;color:var(--ink2)}
.upload .ico{font-size:22px}
.note{background:var(--accent-l); border:1px solid #FDE68A; border-radius:12px; padding:12px 12px; font-size:12px; font-weight:700; color:#7A5310; line-height:1.9}
.note b{color:#7A5310}
.consent{display:flex;gap:8px;align-items:flex-start}
.consent input{width:20px;height:20px;accent-color:var(--brand);margin:2px 0 0}

/* ============ JOB CARD ============ */
.job{
  background:var(--card); border-radius:var(--r2); box-shadow:var(--sh2); border:1px solid #E3ECF0;
  padding:16px; cursor:pointer; transition:transform .12s; position:relative; overflow:hidden
}
.job:active{transform:scale(.985)}
.job + .job{margin-top:12px}
.job .top{display:flex;gap:12px; align-items:flex-start}
.logo{
  width:46px;height:46px;flex:0 0 46px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;color:#FFFFFF;background:linear-gradient(135deg,#088080,#0A7F91 55%,#0A7F91)
}
.job h4{font-size:15px;font-weight:900;margin-bottom:4px}
.job .co{font-size:13px;color:var(--ink3);font-weight:700}
.job .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tag2{font-size:11px;font-weight:800;padding:4px 8px;border-radius:12px;background:#F6FAFB;color:var(--ink2)}
.tag2.g{background:var(--brand-l);color:var(--brand-d)}
.tag2.a{background:var(--accent-l);color:#7A5310}
.tag2.p{background:#EEEBFF;color:#5B3FE0}
.job .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.salary{font-weight:900;color:var(--brand-d);font-size:14px}
.when{font-size:12px;color:var(--ink3);font-weight:700;display:flex;align-items:center;gap:4px}
.fresh{position:absolute;top:0;inset-inline-end:0;background:var(--accent);color:#5A3D06;font-size:11px;font-weight:900;padding:4px 8px;border-bottom-left-radius:10px}
.badge{font-size:11px;font-weight:900;padding:4px 8px;border-radius:8px;display:inline-block}
.b-new{background:#E7F2FF;color:#1D6FD4}
.b-rev{background:var(--accent-l);color:#7A5310}
.b-ref{background:#E4F7EC;color:#0E7A44}

/* ============ MISC ============ */
.hero{
  background:linear-gradient(150deg,#088080 0%,#0A7F91 46%,#0A7F91 100%); color:#FFFFFF; padding:24px 20px 24px;
  position:relative; overflow:hidden
}
.hero:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,0.08);top:-90px;inset-inline-end:-70px}
.hero:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,0.08);bottom:-80px;inset-inline-start:-40px}
.hero h2{font-size:20px;font-weight:900;margin-bottom:8px;position:relative}
.hero p{font-size:13px;opacity:.92;line-height:1.9;position:relative;margin:0}
.stat{background:rgba(255,255,255,0.16);border-radius:16px;padding:8px;text-align:center;backdrop-filter:blur(4px)}
.stat b{display:block;font-size:16px;font-weight:900}
.stat span{font-size:11px;opacity:.9;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;position:relative}

.langpick{display:flex;flex-direction:column;gap:12px}
.langbtn{
  display:flex;align-items:center;gap:12px;border:1px solid #E3ECF0;background:#FFFFFF;border-radius:16px;padding:16px;
  cursor:pointer;font-family:inherit;transition:.15s;box-shadow:var(--sh2)
}
.langbtn:hover{border-color:var(--brand);transform:translateY(-2px)}
.langbtn .flag{font-size:22px}
.langbtn b{display:block;font-size:15px;font-weight:900;color:var(--ink)}
.langbtn span{font-size:12px;color:var(--ink3);font-weight:700}
.langbtn .chev{margin-inline-start:auto;color:var(--ink3);font-size:18px}

.logo-big{
  width:96px;height:96px;border-radius:24px;background:linear-gradient(140deg,#088080,#0A7F91);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-brand);margin:0 auto
}
.brandname{font-size:26px;font-weight:900;letter-spacing:0.4px;margin:16px 0 4px}
.latin{font-size:12px;font-weight:800;letter-spacing:3px;color:var(--ink3)}

.sheetwrap{position:absolute;inset:0;z-index:80;display:flex;align-items:flex-end;background:rgba(16,28,36,0.5);backdrop-filter:blur(2px)}
.sheet{
  background:var(--card); width:100%; border-radius:24px 24px 0 0; max-height:92%; overflow-y:auto;
  animation:up .26s cubic-bezier(.2,.9,.25,1); padding-bottom:20px
}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet .grab{width:44px;height:5px;border-radius:12px;background:#E3ECF0;margin:8px auto 8px}
.sheetbody{padding:8px 16px 0}

.tabs{display:flex;background:#E3ECF0;border-radius:16px;padding:4px;margin:0 0 16px}
.tabs button{flex:1;border:0;background:transparent;font-family:inherit;font-weight:800;font-size:14px;color:var(--ink2);padding:8px;border-radius:12px;cursor:pointer}
.tabs button.on{background:#FFFFFF;color:var(--brand-d);box-shadow:var(--sh2)}

.tabbar{display:flex;background:#FFFFFF;border-top:1px solid var(--line);padding:8px 8px 12px}
.tabbar button{
  flex:1;border:0;background:transparent;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;color:var(--ink3);font-size:11px;font-weight:800;padding:4px
}
.tabbar button.on{color:var(--brand-d)}
.tabbar .ti{font-size:20px}

.person{display:flex;gap:12px;align-items:center;background:#FFFFFF;border-radius:16px;padding:12px;box-shadow:var(--sh2);border:1px solid #E3ECF0;margin-bottom:8px;cursor:pointer}
.avatar{width:46px;height:46px;flex:0 0 46px;border-radius:50%;object-fit:cover;background:#E3ECF0;border:2px solid #FFFFFF;box-shadow:var(--sh2)}
.avatar.ph{display:flex;align-items:center;justify-content:center;font-weight:900;color:#FFFFFF;font-size:16px;background:linear-gradient(135deg,#7C5CFF,#0E9F8E)}
.dot-line{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.mini{font-size:11px;font-weight:800;color:var(--ink2);background:#F6FAFB;padding:4px 8px;border-radius:8px}
.docbox{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#F6FAFB;position:relative}
.docbox img{width:100%;display:block;min-height:130px;object-fit:cover}
.docbox .lbl{position:absolute;bottom:0;inset-inline:0;background:linear-gradient(transparent,rgba(16,28,36,0.8));color:#FFFFFF;font-size:11px;font-weight:800;padding:16px 8px 8px}
.locked{display:flex;align-items:center;gap:8px;background:#FFF4DE;border:1px solid #FDE68A;color:#7A5310;padding:12px;border-radius:12px;font-size:13px;font-weight:800}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border:0}
.kv span{color:var(--ink3);font-weight:700;flex:0 0 auto}
.kv b{font-weight:800;text-align:end;word-break:break-word}
.empty{text-align:center;padding:46px 20px;color:var(--ink3)}
.empty .big{font-size:38px;margin-bottom:8px}
.toast{
  position:absolute;bottom:82px;inset-inline:22px;background:#0F1F2B;color:#FFFFFF;padding:12px 16px;border-radius:16px;
  font-size:14px;font-weight:800;text-align:center;z-index:99;box-shadow:var(--sh2);
  animation:up .22s ease; display:flex; align-items:center; justify-content:center; gap:8px
  pointer-events:none;   /* #28: پیام نباید کلیک/لمس را ببلعد */
}
.pill{background:var(--accent-l);color:#7A5310;font-size:11px;font-weight:900;padding:4px 8px;border-radius:8px}
.und-state{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900}
.und-state.ok{color:var(--ok)}
.und-state.no{color:#8A5B00}
.und-thumb{width:64px;height:40px;object-fit:contain;background:#FFFFFF;border:1.2px solid var(--line);border-radius:8px}
/* #26: دکمه‌ی افزودن آگهی ثابت می‌ماند و با اسکرول پایین نمی‌رود */
.fab{
  position:sticky; bottom:18px; width:56px;height:56px;border-radius:20px;border:0;cursor:pointer;
  margin-inline-start:auto; margin-inline-end:16px;
  background:linear-gradient(180deg,#FFB020,#F59E0B); color:#5A3D06; font-size:26px; font-weight:900;
  box-shadow:var(--sh-sun); z-index:40; display:flex;align-items:center;justify-content:center
}
.progress{height:6px;background:#E3ECF0;border-radius:12px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#0A7F91);border-radius:12px;transition:width .3s}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.sw:last-child{border:0}
.sw b{font-size:14px}
.sw span{font-size:12px;color:var(--ink3);font-weight:700;display:block;margin-top:4px}
.toggle{width:50px;height:29px;border-radius:20px;background:#E3ECF0;position:relative;cursor:pointer;flex:0 0 50px;transition:.2s;border:0}
.toggle:after{content:"";position:absolute;width:23px;height:23px;border-radius:50%;background:#FFFFFF;top:3px;inset-inline-start:3px;transition:.2s;box-shadow:var(--sh)}
.toggle.on{background:var(--brand)}
.toggle.on:after{inset-inline-start:24px}
@media (max-width:520px){
  body{padding:0; background:#FFFFFF; min-height:0}
  .phone{max-width:none; height:100vh; height:100dvh; max-height:none; min-height:100vh; border-radius:0; box-shadow:var(--sh2)}
  .notch{display:none}
  .statusbar{display:none}
}

/* ============ برگه A4 تعهدنامه ============ */
.paper-wrap{padding:16px 12px 32px; background:#E3ECF0; min-height:100%}
.paper{
  width:100%; max-width:520px; margin:0 auto; background:#FFFFFF; color:#0F1F2B;
  border:1px solid #E3ECF0; border-radius:8px; box-shadow:var(--sh2);
  padding:24px 20px; position:relative; overflow:auto;
  aspect-ratio:1 / 1.414; min-height:600px;
  font-size:12px; line-height:2; text-align:justify;
}
.paper::-webkit-scrollbar{width:0}
.paper-title{
  font-size:22px; font-weight:900; text-align:center; line-height:1.8;
  border-bottom:2.5px solid #0F1F2B; padding-bottom:8px; margin-bottom:4px;
}
.paper-sub{text-align:center; font-size:11px; color:#57697A; font-weight:700; margin-bottom:16px}
.paper-meta{display:flex; justify-content:space-between; gap:8px; font-size:12px; font-weight:800; color:#3F5566; margin-bottom:12px; flex-wrap:wrap}
.paper p{margin:0 0 12px}
.paper .blank{
  display:inline-block; min-width:74px; text-align:center; font-weight:900; color:#066F6B;
  border-bottom:1.5px dotted #57697A; padding:0 4px;
}
.paper .big-blank{font-size:14px; font-weight:900; color:#066F6B}
.paper h4{font-size:13px; margin:16px 0 8px; padding-top:12px; border-top:1px dashed #E3ECF0; font-weight:900}
.paper input{
  width:100%; font-family:inherit; font-size:12px; font-weight:800; color:#066F6B;
  background:#F6FAFB; border:1.3px dashed #57697A; border-radius:8px; padding:8px 8px; outline:none;
}
.paper input:focus{border-color:var(--brand); background:#FFFFFF}
.paper .grid2c{display:grid; grid-template-columns:1fr 1fr; gap:8px 12px}
.paper .cell label{display:block; font-size:11px; font-weight:800; color:#57697A; margin-bottom:4px}
.paper .cell .val{
  font-size:13px; font-weight:900; color:#066F6B; background:#F6FAFB;
  border-radius:8px; padding:8px 8px; min-height:33px; word-break:break-word
}
.paper .cell .val.huge{font-size:15px}
.paper .idbox{
  border:1.5px dashed #57697A; border-radius:12px; padding:8px; text-align:center; background:#F6FAFB
}
.paper .idbox img{max-width:100%; max-height:150px; border-radius:8px; display:block; margin:0 auto}
.paper .idbox .ph{font-size:11px; color:#57697A; font-weight:800; padding:16px 8px}
.sigwrap{position:relative; border:1.4px solid #E3ECF0; border-radius:12px; background:#F6FAFB; overflow:hidden}
.sigwrap canvas{display:block; width:100%; height:170px; touch-action:none; cursor:crosshair}
.sigwrap .hint{
  position:absolute; inset-inline:0; bottom:6px; text-align:center; font-size:11px;
  color:#57697A; font-weight:800; pointer-events:none
}
.sig-actions{display:flex; gap:8px; margin-top:8px}
.sign-stamp{
  position:absolute; inset-inline-end:14px; bottom:44px; font-size:11px; font-weight:900; color:#0E9F8E99;
  border:1.4px dashed #0E9F8E88; border-radius:8px; padding:4px 8px; transform:rotate(-4deg)
}
.bar-bottom{
  position:sticky; bottom:0; background:#FFFFFF; border-top:1px solid var(--line);
  padding:8px 12px 16px; display:flex; gap:8px; z-index:20
}
@media print{
  body{background:#FFFFFF; padding:0; min-height:0}
  .phone{box-shadow:var(--sh2); border-radius:0; max-width:none; height:auto; max-height:none; min-height:0}
  .statusbar,.notch,.appbar,.bar-bottom,#tabbar{display:none !important}
  .paper{aspect-ratio:auto; box-shadow:var(--sh2); border:0; min-height:0; overflow:visible}
}

/* پیام جایگزین در صورت خطای اجرا */
#boot-error{
  display:none; max-width:620px; margin:40px auto; padding:16px 20px; background:#FFFFFF;
  border:1px solid #FEF0F0; border-inline-start:5px solid var(--danger); border-radius:16px;
  font-size:14px; line-height:2; box-shadow:var(--sh); color:var(--ink)
}
#boot-error b{color:var(--danger)}
#boot-error code{direction:ltr; display:block; background:#F6FAFB; border-radius:12px; padding:8px; margin-top:8px; font-size:12px; overflow:auto}

/* ==========================================================
   DESIGN v2 — لایه‌ی شیکی‌سازی روی استایل‌های قبلی
   (چون بعد از بقیه‌ی قواعد می‌آید، اولویت دارد و کلاس‌ها همان‌های قبلی‌اند)
   ========================================================== */

html,body{-webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
body{
  background:
    radial-gradient(1100px 520px at 12% -12%, #D6F2EC 0%, transparent 58%),
    radial-gradient(900px 480px at 92% 108%, #FFF4DE 0%, transparent 56%),
    radial-gradient(700px 700px at 50% 40%, #ECF3F6 0%, transparent 70%),
    #E3ECF0;
}

/* ---------- قاب گوشی ---------- */
.phone{
  border-radius:44px;
  box-shadow:var(--sh-brand);
}
.statusbar{
  background:linear-gradient(180deg,#FFFFFF 0%,#F6FAFB 100%);
  border-bottom:1px solid rgba(15,31,43,0.05);
}
.shell{background:
  radial-gradient(680px 320px at 100% -6%, #E6F7F4 0%, transparent 60%),
  var(--bg)}

/* ---------- کارت‌ها ---------- */
.card{
  border-radius:var(--r2);
  box-shadow:var(--sh2);
  border:1px solid rgba(15,31,43,0.05);
  padding:16px;
}
.card + .card{margin-top:12px}

/* ---------- دکمه‌ها ---------- */
.btn{
  border-radius:16px; padding:16px 20px; font-size:15px; letter-spacing:0.2px;
  transition:transform .12s cubic-bezier(.2,.9,.3,1), box-shadow .18s, filter .18s;
}
.btn:active{transform:scale(.972)}
.btn-primary{
  background:var(--brand-g2); color:#FFFFFF;
  box-shadow:var(--glow), inset 0 1px 0 rgba(255,255,255,0.3);
}
.btn-primary:hover{filter:saturate(1.08) brightness(1.03)}
.btn-ghost{
  background:#FFFFFF; color:var(--ink);
  box-shadow:inset 0 0 0 1.5px var(--line), 0 6px 16px -12px rgba(15,31,43,0.35);
}
.btn-accent{background:var(--accent-g); color:#5A3D06; box-shadow:var(--sh-sun)}
.btn-sm{padding:8px 16px; border-radius:12px}

/* ---------- تب‌های پایین: نوار شناور ---------- */
.tabbar{
  background:rgba(255,255,255,0.92);
  border-top:0;
  margin:0 8px 8px;
  border-radius:20px;
  padding:8px 8px 8px;
  gap:8px;
  box-shadow:0 -2px 0 rgba(255,255,255,0.6) inset, 0 18px 34px -18px rgba(15,31,43,0.42), 0 0 0 1px rgba(15,31,43,0.05);
}
.tabbar button{
  border-radius:16px; padding:8px 8px; gap:4px; font-size:11px; font-weight:800;
  transition:background .18s, color .18s, transform .12s;
}
.tabbar button.on{
  color:#FFFFFF;
  background:var(--brand-g);
  box-shadow:var(--glow);
}
.tabbar button.on .ti{transform:translateY(-1px) scale(1.06)}
.tabbar .ti{font-size:20px; transition:transform .18s}
.tabbar button:active{transform:scale(.96)}

/* ---------- هدرهای رنگی ---------- */
.hero, .bar-bottom, .appbar.teal{
  border-end-start-radius:26px; border-end-end-radius:26px;
  box-shadow:var(--sh2);
}
.hero{
  background:var(--brand-g);
  padding:24px 20px 24px;
}
.hero:before{
  background:radial-gradient(420px 220px at 88% 0%, rgba(255,255,255,0.35) 0%, transparent 62%) !important;
}
.hero h2{
  font-size:22px; font-weight:900; letter-spacing:-0.2px;
  text-shadow:0 2px 12px rgba(6,60,68,0.25);
}
.hero p{opacity:.94}

/* ---------- لوگو ---------- */
.logo{
  border-radius:16px;
  background:var(--brand-g);
  box-shadow:var(--glow), inset 0 1px 0 rgba(255,255,255,0.25);
}
.logo-big{
  border-radius:24px;
  box-shadow:var(--sh-brand);
}

/* ---------- کارت آگهی ---------- */
.job{
  border-radius:20px;
  box-shadow:var(--sh2);
  border:1px solid rgba(15,31,43,0.05);
  transition:transform .16s cubic-bezier(.2,.9,.3,1), box-shadow .2s;
}
.job:hover{transform:translateY(-2px); box-shadow:var(--sh3)}
.job:active{transform:scale(.99)}
.job h4{font-size:15px; font-weight:900; letter-spacing:-0.2px}
.job .co{color:var(--ink3)}
.job .tags{gap:8px; margin-top:8px}
.job .foot{margin-top:12px}
.salary{color:var(--brand-d); font-weight:900; font-size:14px}
.when{color:var(--ink3); font-weight:800}
.fresh{
  z-index:3;
  border-radius:0 22px 0 14px;
  background:linear-gradient(135deg,#FFB020,#F59E0B);
  color:#5A3D06; letter-spacing:0.4px;
  box-shadow:var(--sh-sun);
  padding:4px 12px;
}
/* کاور عکس آگهی روی کارت */
.job .cover{
  position:relative; margin:-16px -16px 12px; height:158px; overflow:hidden;
  border-radius:20px 22px 0 0; background:#D9E4EA;
}
.job .cover img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.01)}
.job .cover:after{
  content:""; position:absolute; inset:auto 0 0 0; height:58%;
  background:linear-gradient(180deg,rgba(16,28,36,0.05) 0%,rgba(16,28,36,0.55) 100%);
}
.job .cover .cstat{
  position:absolute; inset-inline-start:10px; bottom:10px; z-index:2;
  display:flex; gap:8px; align-items:center;
  background:rgba(255,255,255,0.92); color:#0F1F2B;
  border-radius:12px; padding:4px 8px; font-size:11px; font-weight:900;
  box-shadow:var(--sh2);
}
.job .cover .cplay{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:2;
}
.job .cover .cplay i{
  width:52px;height:52px;border-radius:50%;background:rgba(6,60,68,0.5);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-style:normal;color:#FFFFFF;
  box-shadow:var(--sh2); backdrop-filter:blur(2px);
}
.tag2{border-radius:12px; padding:4px 8px}
.chip{border-radius:12px; background:#F6FAFB; border-color:var(--line)}
.chip.on{
  background:var(--brand-l); border-color:rgba(14,159,142,0.55); color:var(--brand-d);
  box-shadow:var(--sh-brand);
}
.badge{border-radius:12px}
.sec-title{font-size:14px; letter-spacing:0}
.sec-title .dot{
  width:8px;height:8px;border-radius:8px;
  background:var(--brand-g);
  box-shadow:var(--sh-brand);
}
.mini{border-radius:8px}

/* ---------- فرم‌ها ---------- */
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=password],select,textarea{
  border-radius:16px; border:1px solid var(--line); background:#F6FAFB;
  transition:border-color .16s, box-shadow .2s, background .16s;
}
input:focus,select:focus,textarea:focus{
  border-color:rgba(14,159,142,0.62); background:#FFFFFF; box-shadow:var(--ring);
}
.field > label{font-weight:800; color:var(--ink2)}

/* ---------- انتخاب زبان (صفحه‌ی اول) ---------- */
.langpick{gap:12px}
.langbtn{
  border-radius:20px; border:1px solid rgba(255,255,255,0.5);
  background:linear-gradient(180deg,rgba(255,255,255,0.95),rgba(246,250,251,0.95));
  box-shadow:var(--sh2);
  padding:16px 16px;
}
.langbtn:hover{transform:translateY(-2px); box-shadow:var(--sh2)}
.langbtn b{font-size:16px; font-weight:900; letter-spacing:-0.2px}
.langbtn .chev{
  width:34px;height:34px;border-radius:50%; display:flex;align-items:center;justify-content:center;
  background:var(--brand-l); color:var(--brand-d) !important; font-size:16px; font-weight:900;
}
.langbtn .flag{font-size:26px}

/* ---------- برگه‌ی پایین (sheet) ---------- */
.sheet{
  border-radius:24px 30px 0 0;
  box-shadow:var(--sh2);
}
.sheet .grab{width:52px;height:5px;border-radius:99px;background:linear-gradient(90deg,#E3ECF0,#57697A,#E3ECF0)}

/* ---------- اعلان ---------- */
.toast{
  pointer-events:none;   /* #28 */
  border-radius:16px;
  background:linear-gradient(135deg,rgba(15,31,43,0.95),rgba(6,60,68,0.95));
  box-shadow:var(--sh2);
  font-weight:800; letter-spacing:.1px;
}

/* ---------- تب‌های داخلی پنل ---------- */
.tabs{background:#ECF3F6; border-radius:16px; padding:4px; gap:4px}
.tabs button{border-radius:12px; font-weight:800}
.tabs button.on{box-shadow:var(--sh2)}

/* ---------- ورود نرم صفحه‌ها ---------- */
@keyframes kbIn{from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none}}
#view.kb-enter{animation:kbIn .3s cubic-bezier(.2,.85,.25,1)}
@keyframes kbPop{from{opacity:0; transform:scale(.97) translateY(12px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){
  #view.kb-enter{animation:none}
  .job:hover{transform:none}
}

/* ==========================================================
   DESIGN v3 — رنگ‌های به‌روز + سطح‌های شیشه‌ای مات (glassmorphism)
   ========================================================== */


/* ---------- پس‌زمینه‌ی مش رنگی + هاله‌ها ---------- */
.shell{
  background:
    radial-gradient(760px 380px at 108% -8%, #D6F2EC 0%, transparent 62%),
    radial-gradient(680px 420px at -10% 18%, #EEEBFF 0%, transparent 60%),
    radial-gradient(620px 420px at 104% 74%, #FFEDE7 0%, transparent 58%),
    radial-gradient(560px 360px at -6% 96%, #FFF4DE 0%, transparent 60%),
    linear-gradient(180deg,#ECF3F6 0%, #ECF3F6 100%);
}
.kb-blobs{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0}
.kb-blob{position:absolute; border-radius:50%; filter:blur(48px); opacity:.5}
.kb-blob.b1{width:250px;height:250px;top:-70px;inset-inline-start:-80px;background:radial-gradient(circle at 32% 32%,#2FD6A8,#10B39F 72%)}
.kb-blob.b2{width:280px;height:280px;top:24%;inset-inline-end:-120px;background:radial-gradient(circle at 62% 38%,#7C5CFF,#7C5CFF 72%);opacity:.42}
.kb-blob.b3{width:250px;height:250px;bottom:8%;inset-inline-start:-100px;background:radial-gradient(circle at 42% 58%,#FDBA74,#FF7A59 72%);opacity:.38}
.kb-blob.b4{width:200px;height:200px;bottom:-60px;inset-inline-end:-40px;background:radial-gradient(circle at 50% 50%,#FFF4DE,#FFB020 72%);opacity:.34}
#view{position:relative; z-index:1}
#tabbar, #overlay{position:relative; z-index:2}

/* ---------- سطح شیشه‌ای مات ---------- */
.glass, .card, .job, .person, .langbtn, .upload, .docbox, .tabs, .contact-row{
  background:var(--glass-1);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--glass-line);
  box-shadow:var(--glass-shadow);
}
@supports not ((-webkit-backdrop-filter:blur(4px)) or (backdrop-filter:blur(4px))){
  .glass, .card, .job, .person, .langbtn, .upload, .docbox, .tabs, .contact-row{background:rgba(255,255,255,0.95)}
}
.card{background:var(--glass-1)}
.card .card, .card .kv, .card .docbox{backdrop-filter:none}

/* ---------- نوار پایین شیشه‌ای ---------- */
.tabbar{
  background:linear-gradient(150deg,rgba(255,255,255,0.86),rgba(255,255,255,0.7));
  -webkit-backdrop-filter:blur(22px) saturate(190%);
  backdrop-filter:blur(22px) saturate(190%);
  border:1px solid rgba(255,255,255,0.85) !important;
  box-shadow:var(--sh2);
}
.tabbar button.on{
  background:var(--grad-brand);
  box-shadow:var(--sh-brand);
  color:#FFFFFF;
}
.tabbar button.on .ti{filter:drop-shadow(0 2px 6px rgba(15,31,43,0.25))}

/* ---------- هدرها با مش رنگی ---------- */
.hero, .appbar.teal, .bar-bottom{
  background:var(--grad-brand) !important;
}
.hero{
  position:relative; overflow:hidden;
  box-shadow:var(--sh2);
}
.hero:before{
  content:""; position:absolute; inset:0; background:
    radial-gradient(420px 220px at 88% -10%, rgba(255,255,255,0.42) 0%, transparent 62%),
    radial-gradient(320px 200px at 6% 108%, rgba(124,92,255,0.42) 0%, transparent 66%),
    radial-gradient(300px 180px at 70% 116%, rgba(255,122,89,0.35) 0%, transparent 68%) !important;
  pointer-events:none;
}
.hero > *{position:relative; z-index:1}
.hero h2{font-weight:900; letter-spacing:-.4px; text-shadow:0 3px 16px rgba(6,60,68,0.3)}
.hero .stat{
  background:linear-gradient(150deg,rgba(255,255,255,0.3),rgba(255,255,255,0.12)) !important;
  border:1px solid rgba(255,255,255,0.42);
  box-shadow:var(--sh2);
  border-radius:16px;
}
.hero .stat b{color:#FFFFFF !important}

/* ---------- دکمه‌ها ---------- */
.btn{border-radius:16px}
.btn-primary{
  background:var(--grad-brand);
  box-shadow:var(--sh-brand);
}
.btn-accent{
  background:var(--grad-sun); color:#5A3D06;
  box-shadow:var(--sh-sun);
}
.btn-dark{background:linear-gradient(135deg,#3F5566,#0F1F2B)}
.btn-danger{background:linear-gradient(135deg,#FEF0F0,#FFEDE7); color:#B33A18; box-shadow:inset 0 0 0 1.5px #FFEDE7}
.btn-ghost{

/* ---------- چیپ‌ها، نشان‌ها، آمار ---------- */
.tag2{font-weight:800; border:1px solid rgba(255,255,255,0.7); box-shadow:var(--sh2)}

.mini{

}
.badge{font-weight:900; border:1px solid rgba(255,255,255,0.6)}
.b-new{background:linear-gradient(135deg,#EEEBFF,#EEEBFF); color:#5B3FE0}
.b-rev{background:linear-gradient(135deg,#FFF4DE,#FDE68A); color:#8A5B00}
.b-ref{background:linear-gradient(135deg,#E2FBF3,#D6F2EC); color:#066F6B}
.stats .card{padding:12px; text-align:center; background:linear-gradient(150deg,rgba(255,255,255,0.92),rgba(255,255,255,0.62))}
.stats .card b{color:var(--brand-d)}
.stats .card:nth-child(2) b{color:var(--violet-d)}
.stats .card:nth-child(3) b{color:#B33A18}
.salary{color:var(--brand-d); font-weight:900}
.fresh{
  background:var(--accent-g) !important; color:#5A3D06 !important;   /* #33: متن تیره روی نارنجی = خوانا */

  letter-spacing:.4px;
}
.sec-title .dot{background:var(--grad-brand); box-shadow:var(--sh-brand)}
.sec-title{color:var(--ink2)}

/* ---------- فرم‌ها و ورودی‌ها ---------- */
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=password],select,textarea{
  background:linear-gradient(150deg,rgba(255,255,255,0.95),rgba(255,255,255,0.75)) !important;

  box-shadow:var(--sh2);
  border-radius:16px;
}
input:focus,select:focus,textarea:focus{

}
.field > label{color:var(--ink2); font-weight:800}

/* ---------- برگه‌ی پایین و اعلان، شیشه‌ای ---------- */
.sheet{
  background:linear-gradient(180deg,rgba(255,255,255,0.95),rgba(255,255,255,0.8));
  -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%);
  border-top:1px solid rgba(255,255,255,0.9);

}
.sheet .grab{background:linear-gradient(90deg,#57697A,#57697A,#57697A)}
.toast{
  background:linear-gradient(135deg,rgba(15,31,43,0.92),rgba(6,60,68,0.92));

}

  background:linear-gradient(150deg,rgba(255,255,255,0.7),rgba(255,255,255,0.42));

}

/* ---------- کارت آگهی: قاب شیشه‌ای و کاور رنگی ---------- */
.job{overflow:hidden}
.job .cover{box-shadow:var(--sh2)}
.job .cover .cstat{
  background:linear-gradient(150deg,rgba(255,255,255,0.92),rgba(255,255,255,0.7));
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.8);
}
.logo{
  background:var(--grad-brand);
  box-shadow:var(--sh-brand);
}
.person .avatar{border-color:rgba(255,255,255,0.9)}

/* ---------- صفحه‌ی انتخاب زبان ---------- */
.langbtn{
  background:linear-gradient(150deg,rgba(255,255,255,0.95),rgba(255,255,255,0.8)) !important;
  border:1px solid rgba(255,255,255,0.9) !important;
}
.langbtn .chev{background:var(--grad-brand); color:#FFFFFF !important; box-shadow:var(--sh-brand)}
.langbtn:hover{transform:translateY(-3px)}
.brandname{background:linear-gradient(135deg,#19CBAD,#7C5CFF 70%,#FF7A59); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent}
html[dir=rtl] .brandname{background:linear-gradient(-135deg,#19CBAD,#7C5CFF 70%,#FF7A59); -webkit-background-clip:text; background-clip:text}

/* ---------- v3.1: شیشه‌ی خوانا‌تر + هاله‌های پررنگ‌تر ---------- */
.kb-blob{filter:blur(38px)}
.kb-blob.b1{width:300px;height:300px;top:-90px;inset-inline-start:-110px;opacity:.62}
.kb-blob.b2{width:330px;height:330px;top:20%;inset-inline-end:-150px;opacity:.5}
.kb-blob.b3{width:300px;height:300px;bottom:4%;inset-inline-start:-130px;opacity:.46}
.kb-blob.b4{width:250px;height:250px;bottom:-70px;inset-inline-end:-60px;opacity:.42}
.card, .job, .person, .docbox{background:linear-gradient(150deg,rgba(255,255,255,0.8) 0%,rgba(255,255,255,0.5) 100%)}
.job{position:relative}
.job:after{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,0.5) 0%,rgba(255,255,255,0.05) 38%);
  mix-blend-mode:screen; opacity:.7;
}
.job > *:not(.fresh){position:relative; z-index:1}
.job > .fresh{position:absolute; z-index:5}
.brandname{
  background:linear-gradient(135deg,#E6F7F4 0%,#A7F3D0 34%,#FDE68A 68%,#FDBA74 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 14px rgba(15,31,43,0.35));
}
html[dir=rtl] .brandname{
  background:linear-gradient(-135deg,#E6F7F4 0%,#A7F3D0 34%,#FDE68A 68%,#FDBA74 100%);
  -webkit-background-clip:text; background-clip:text;
}

/* ---------- v3.2: هدرهای داخلی (خانه/پروفایل/ارتباط) با درخشش ---------- */
.kb-head{position:relative;overflow:hidden;border-radius:0 0 26px 26px;box-shadow:var(--sh2)}
.kb-head:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(360px 200px at 88% -12%, rgba(255,255,255,0.42) 0%, transparent 62%),
    radial-gradient(280px 180px at 4% 110%, rgba(124,92,255,0.35) 0%, transparent 66%),
    radial-gradient(260px 160px at 72% 118%, rgba(255,122,89,0.35) 0%, transparent 68%);
}
.kb-head > *{position:relative;z-index:1}

/* #28: دکمه‌ی قلب در هدر صفحه‌ی آگهی */
.heart-btn{
  width:42px;height:42px;flex:0 0 42px;border-radius:50%;border:1px solid rgba(255,255,255,0.75);
  background:rgba(255,255,255,0.2); color:#FFFFFF; font-size:20px; line-height:1.5; cursor:pointer;
  display:flex;align-items:center;justify-content:center; transition:transform .12s ease, background .18s ease;
  box-shadow:var(--sh2)}
.heart-btn:hover{transform:translateY(-2px)}
.heart-btn:active{transform:scale(.94)}
.heart-btn.on{background:rgba(255,255,255,0.92); border-color:#FFFFFF; color:#C2185B}

/* ---------- #28: پسندیده (Liked) ---------- */
.badge.b-like{background:linear-gradient(135deg,#FFE3ED,#FFC8DC);color:#C2185B;font-weight:900}
.lk-row{
  display:flex; gap:12px; align-items:center; padding:8px; border-radius:16px; cursor:pointer;
  background:linear-gradient(150deg,rgba(255,255,255,0.86),rgba(255,255,255,0.6));
  border:1px solid rgba(255,255,255,0.9); box-shadow:var(--sh2);
  margin-bottom:8px; transition:transform .12s ease;
}
.lk-row:hover{transform:translateY(-2px)}
.lk-row:active{transform:scale(.995)}
.lk-row .iconbtn{width:30px;height:30px;font-size:13px;flex:0 0 30px}

/* ---------- v3.3: خط اعتبار (فوتر) ---------- */
.kb-credit{
  direction:ltr; margin-top:16px; padding:8px 12px; border-radius:16px; text-align:center;
  font:600 11px/1.7 "Segoe UI",Tahoma,sans-serif; letter-spacing:0.4px; color:rgba(87,105,122,0.5);   /* #28: کم‌رنگ‌تر و کم‌تر */
  background:linear-gradient(150deg,rgba(255,255,255,0.42) 0%,rgba(255,255,255,0.2) 100%);
  -webkit-backdrop-filter:blur(10px) saturate(130%); backdrop-filter:blur(10px) saturate(130%);
  border:1px solid rgba(255,255,255,0.55);
  box-shadow:var(--sh2); opacity:.72;
}
/* ---------- #27: دکمه‌ی ثابت «افزودن آگهی» در نوار بالای پنل مدیریت ---------- */
.admin-add{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; flex:0 0 auto;
  height:38px; min-width:38px; padding:0 12px; cursor:pointer;
  border:0; border-radius:16px; font-family:inherit; font-size:13px; font-weight:900;
  background:linear-gradient(180deg,#FFB020,#F59E0B); color:#5A3D06;
  box-shadow:var(--sh-sun);
  transition:transform .12s, filter .16s;
}
.admin-add svg{ width:17px; height:17px; display:block; }
.admin-add:hover{ filter:brightness(1.04); }
.admin-add:active{ transform:scale(.95); }
@media (max-width:400px){ .admin-add{ padding:0 8px; } .admin-add span{ display:none; } }

/* ---------- #26: پنجره‌ی «مطمئن هستید؟» ---------- */
/* پوشش تمام‌صفحه‌ی واقعی: مستقل از اسکرول، پنجره همیشه وسط صفحه دیده می‌شود */
.cfm-wrap{
  position:fixed; inset:0; z-index:95; display:flex; align-items:center; justify-content:center;
  padding:24px; background:rgba(16,28,36,0.5); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  overflow-y:auto;
}
@supports not ((backdrop-filter: blur(3px)) or (-webkit-backdrop-filter: blur(3px))){
  .cfm-wrap{ background:rgba(16,28,36,0.62); }
}
.cfm-box{
  background:linear-gradient(180deg,#FFFFFF,#F6FAFB); border-radius:20px; padding:20px;
  width:100%; max-width:360px; box-shadow:var(--sh); animation:up .2s ease;
  border:1px solid rgba(255,255,255,0.9);
}
.cfm-ico{
  width:54px;height:54px;margin:0 auto 8px;border-radius:20px;font-size:26px;
  display:flex;align-items:center;justify-content:center;
  background:var(--danger-l,#FEF0F0); color:var(--danger);
}
.cfm-title{ font-size:16px; font-weight:900; text-align:center; color:var(--ink); margin-bottom:8px; }
.cfm-sub{
  font-size:13px; font-weight:800; color:var(--brand-d); text-align:center;
  background:rgba(14,159,142,0.12); border:1px solid rgba(14,159,142,0.2);
  border-radius:12px; padding:8px 8px; margin-bottom:12px; line-height:1.8;
}
.cfm-msg{ font-size:13px; font-weight:700; color:#3B4753; text-align:center; line-height:2; margin-bottom:16px; }
.cfm-danger{ background:linear-gradient(180deg,#E5484D,#E5484D) !important; color:#FFFFFF !important; box-shadow:var(--sh-danger); }

/* ---------- #25: دکمه‌ی خروج زیبا در نوار بالای پنل مدیریت ---------- */
.admin-exit{
  display:inline-flex; align-items:center; gap:8px; flex:0 0 auto;
  height:38px; padding:0 16px 0 12px; cursor:pointer;
  border:1.4px solid rgba(255,255,255,0.55); border-radius:16px;
  background:linear-gradient(180deg,rgba(6,50,58,0.46),rgba(6,50,58,0.30));   /* #33: زمینه‌ی تیره‌تر → متن سفید خوانا */
  color:#FFFFFF; font-family:inherit; font-size:13px; font-weight:900; letter-spacing:0.2px;
  box-shadow:var(--sh2);
  -webkit-backdrop-filter:blur(7px) saturate(150%); backdrop-filter:blur(7px) saturate(150%);
  transition:transform .12s, background .16s, box-shadow .16s;
}
html[dir=rtl] .admin-exit{ padding:0 12px 0 16px; }
.admin-exit svg{ width:17px; height:17px; display:block; }
.admin-exit:hover{
  background:linear-gradient(180deg,rgba(255,255,255,0.5),rgba(255,255,255,0.25));
  box-shadow:var(--sh2);
}
.admin-exit:active{ transform:scale(.95); }

/* ---------- #23: کادرهای ورودی یکسان و مرتب در «تنظیمات» پنل مدیر ---------- */
.card .adm-inp{
  width:100%; height:52px !important; min-height:52px !important;
  padding-left:16px !important; padding-right:16px !important;
  font-size:15px !important; font-weight:700 !important; color:var(--ink) !important;

}

}

/* فیلد رمزِ تنظیمات هم فضای امن دکمه‌ی چشم را داشته باشد (تقدم بر .adm-inp) */
.card .pw-wrap > input{ padding-right:52px !important; }
.adm-lbl{
  display:block; font-size:13px; font-weight:800; color:var(--ink2);
  margin:0 0 8px; letter-spacing:0.2px;
}
.adm-note{ margin-top:8px; }

/* ---------- #22: نمایش رمز و ورود دومرحله‌ای ---------- */
/* کادر چشم: همیشه سمت راستِ کادر (فیلدهای رمز همه LTR هستند) و با فضای امن از متن */
.pw-wrap{ position:relative; display:block; direction:ltr; }

.pw-eye{
  position:absolute; right:9px; top:50%; transform:translateY(-50%);

  display:flex; align-items:center; justify-content:center; padding:0; margin:0;
}

.pw-wrap:before{
  content:""; position:absolute; right:43px; top:4px; bottom:4px; width:18px;

}

.pw-eye.on{ background:rgba(255,176,32,0.2); color:#8A5B00; }

}

}

}

/* ---------- storage (sandbox-safe) ---------- */
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k) ?? mem[k] ?? null }catch(e){ return mem[k] ?? null } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v) }catch(e){} }
};
function persist(){
  store.set("kb_lang", S.lang||"");
  store.set("kb_jobs", JSON.stringify(S.jobs));
  store.set("kb_people", JSON.stringify(S.people));
  store.set("kb_applied", JSON.stringify(S.applied));
  store.set("kb_liked", JSON.stringify(S.liked));
  store.set("kb_session", JSON.stringify(S.session));
  store.set("kb_broker", JSON.stringify(S.broker));
  store.set("kb_admin", JSON.stringify(S.adminCred));
  store.set("kb_2fa", JSON.stringify(S.twoFA));
  store.set("kb_rememberedLogin", JSON.stringify(S.rememberedLogin));
  store.set("kb_adsFee", String(S.adsFee||DEFAULT_ADS_FEE));   // #34
}
function restore(){
  S.lang = store.get("kb_lang") || null;
  if(S.lang){ S.screen="welcome"; }
  try{ const j=store.get("kb_jobs"); if(j) S.jobs=JSON.parse(j); }catch(e){}
  try{ const p=store.get("kb_people"); if(p) S.people=JSON.parse(p); }catch(e){}
  try{ const a=store.get("kb_applied"); if(a) S.applied=JSON.parse(a); }catch(e){}
  try{ const l=store.get("kb_liked"); if(l) S.liked=JSON.parse(l); }catch(e){}
  try{ const s=store.get("kb_session"); if(s) S.session=JSON.parse(s); }catch(e){}
  try{ const f=store.get("kb_adsFee"); if(f) S.adsFee=f; }catch(e){}   // #34
  // #38: مبلغ پیش‌فرض قدیمیِ نمونه ۶۰۰۰ لیر → تصمیم جدید ۵۰۰ لیر.
  if(String(S.adsFee||"") === "6000" && !store.get("kb_payment_v38")){
    S.adsFee=String(DEFAULT_ADS_FEE); store.set("kb_adsFee", S.adsFee);
  }
  store.set("kb_payment_v38", "1");
  try{ const b=store.get("kb_broker"); if(b) S.broker=JSON.parse(b); }catch(e){}
  try{ const a=store.get("kb_admin"); if(a){ const o=JSON.parse(a);
        S.adminCred={ user:(o.user||ADMIN_USER), pass:(o.pass||PWD) }; } }catch(e){}
  try{ const f=store.get("kb_2fa"); if(f){ const o=JSON.parse(f);
        S.twoFA={ on:!!o.on, secret:o.secret||"", recovery:o.recovery||"", pending:!!o.pending }; } }catch(e){}
  try{ const r=store.get("kb_rememberedLogin"); if(r){ const o=JSON.parse(r);
        S.rememberedLogin=(o&&o.username&&o.password)?{username:String(o.username),password:String(o.password)}:null; } }catch(e){}
  if(!S.broker.card) S.broker.card=DEFAULT_CARD;   // شماره کارت ثابت پیش‌فرض
  delete S.broker.fee;
  if(S.session) S.isAdmin=false;
  if(!S.jobs.length) seedJobs();
  if(!S.people.length) seedPeople();

function agoFmt(iso){
  const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<3600) return t("justNow");
  if(s<86400) return t("hAgo",{n:num(Math.floor(s/3600))});
  if(s<2592000) return t("dAgo",{n:num(Math.floor(s/86400))});
  const d=new Date(iso);
  return num(d.getFullYear())+"/"+num(("0"+(d.getMonth()+1)).slice(-2))+"/"+num(("0"+d.getDate()).slice(-2));
}

  const i = p<5?0 : p<20?1 : p<40?2 : p<60?3 : p<80?4 : 5;

const V=()=>document.getElementById("view");
const TB=()=>document.getElementById("tabbar");
const OV=()=>document.getElementById("overlay");

function shell({bar, body, tabbar, fab}){
  TB().innerHTML = tabbar===false ? "" : tabbarHtml();
  return `${bar||""}<div style="padding:16px 16px ${fab?"88px":"28px"}">${body}</div>`+ (fab?fab:"");
}
function tabbarHtml(){
  // مدیر که وارد می‌شود، فقط پنل مدیریت را می‌بیند: بدون تب «آگهی‌ها» و «پروفایل من»
  if(S.isAdmin) return "";
  if(!["home","profile","route","contact"].includes(S.screen)) return "";
  // v52.0.2: tab «مسیریابی» فقط پس از ثبت‌نام، و هرگز پشت قفل پرداخت نیست.
  const items=[["home","tabJobs","🏠"],["profile","tabProfile","👤"],...(S.session?[["route","tabRoute","🧭"]]:[]),["contact","tabContact","☎️"]];
  const locked=!userUnlocked();      // #34: تب آگهی‌ها تا پرداخت، قفل است
  return `<div class="tabbar">${items.map(([id,lbl,ico])=>
    (id==="home" && locked)
      ? `<button class="${S.screen===id?"on":""}" onclick="go('home')"><span class="ti">🔒</span>${t("pay_locked_tab")}</button>`
      : `<button class="${S.screen===id?"on":""}" onclick="go('${id}')"><span class="ti">${ico}</span>${t(lbl)}</button>`).join("")}</div>`;
}

function uploadBox(key,ico,label,hint){
  const v=S.form[key];
  return `<div class="upload ${v?"filled":""}" onclick="document.getElementById('file_${key}').click()">
    ${v?`<span class="tag">✓ ${t("uploaded")}</span><img src="${v}">`:
      `<div class="ico">${ico}</div><div class="cap">${label}</div><div class="small muted">${hint}</div>
       <div class="small" style="color:var(--brand-d);font-weight:900;margin-top:4px">${t("tapUpload")}</div>`}
  </div>`;
}
function pickFile(ev,key){
  const f=ev.target.files?.[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=460, sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=img.width*sc; c.height=img.height*sc;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      S.form[key]=c.toDataURL("image/jpeg",.62);
      S.formErr.docs=false; renderKeep();
    };
    img.onerror=()=>{ S.form[key]=r.result; renderKeep(); };
    img.src=r.result;
  };
  r.readAsDataURL(f);
}

function routeCityName(c){ return (c.n&& (c.n[S.lang]||c.n.tr)) || c.id; }
function routeKind(k){ return t({metro:"routeMetro",metrobus:"routeMetrobus",tram:"routeTram",rail:"routeRail",funicular:"routeFunicular"}[k]||"routeNet"); }
function routeGeo(p){ return String(p[2]??p.lat).slice(0,9)+", "+String(p[3]??p.lon).slice(0,9); }
function routeHref(p){ const lat=p[2]??p.lat, lon=p[3]??p.lon; return "https://www.openstreetmap.org/?mlat="+lat+"&mlon="+lon+"#map=16/"+lat+"/"+lon; }
function routeToggle(key){ S.routeLine=S.routeLine===key?"":key; renderKeep(); }
function screenRoute(){
  const u=S.session;
  if(!u) return shell({body:`<div class="empty"><div class="big">🧭</div><b>${t("routeNeedReg")}</b><div class="small muted" style="margin-top:8px;line-height:1.9">${t("routeNeedRegHint")}</div><div style="height:14px"></div><button class="btn btn-primary" onclick="startReg()">${t("startBtn")}</button></div>`,tabbar:true});
  const cities=ROUTES_TR.cities||[];
  const city=cities.find(x=>x.id===S.routeCity)||cities.find(x=>x.id==="istanbul")||cities[0];
  const q=String(S.routeQuery||"").trim().toLocaleLowerCase();
  const match=x=>!q || String(x||"").toLocaleLowerCase().includes(q);
  const airports=(city.air||[]).filter(a=>match(a[0])||match(a[1]));
  const lines=(city.lines||[]).map((l,i)=>({l,i})).filter(({l})=>match(l.r)||match(l.n)||(l.s||[]).some(st=>match(st[0])));
  const allAir=cities.reduce((n,c)=>n+(c.air||[]).length,0), allLines=cities.reduce((n,c)=>n+(c.lines||[]).length,0);
  const maps=(p,label)=>`<a href="${routeHref(p)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="font-size:12px;font-weight:900;color:var(--brand-d);text-decoration:none;white-space:nowrap">📍 ${t("routeMap")}</a>`;
  const lineHtml=lines.map(({l,i})=>{
    const key=city.id+"_"+i, open=S.routeLine===key;
    return `<div style="border:1px solid var(--line);border-radius:15px;background:#F8FBFC;margin-bottom:8px;overflow:hidden">

      </button>${open?`<div style="border-top:1px solid var(--line);padding:8px 12px 10px"><div class="small muted" style="margin-bottom:7px">${t("routeStations",{n:num((l.s||[]).length)})}</div>${(l.s||[]).map((st,j)=>`<div style="display:flex;align-items:center;gap:8px;padding:4px 0"><span style="width:16px;color:${esc(l.c||'#0E9F8E')};font-weight:900;text-align:center">${j===0?"●":j===l.s.length-1?"■":"•"}</span><span style="flex:1;min-width:0"><b style="font-size:12px">${esc(st[0])}</b><small class="muted" dir="ltr" style="display:block;font-size:10px">${routeGeo(st)}</small></span>${maps(st)}</div>`).join("")}</div>`:""}
    </div>`;
  }).join("");
  const body=`
  <div class="kb-head" style="background:linear-gradient(135deg,#088080,#0A7F91 55%,#0A7F91);margin:-16px -16px 16px;padding:18px 16px;color:#fff">

/** #29: «پسندیده‌ها» و «درخواست‌های ارسالی» یک متقاضی — در اپ اندرویدی از Firestore
 *  (likes/{applicantId}_{jobId} و applications/…) خوانده می‌شود؛ در دمو از همین گوشی. */
function activitySec(p){
  // مثل اپ اندرویدی: پسندیده‌ها/درخواست‌ها به «همین متقاضی» تعلق دارند (در سرور: likes/{applicantId}_{jobId})
  const rows = (ids, iconKey) => {
    const list = (ids||[]).map(id=>S.jobs.find(j=>j.id===id)).filter(Boolean);
    if(!list.length) return `<div class="small muted">${t(iconKey==="likes"?"no_likes_yet":"no_apps_yet")}</div>`;
    return list.map(j=>`<div class="kv" style="cursor:pointer" onclick="openJobPage('${j.id}','person')">
      <span style="display:flex;align-items:center;gap:8px;min-width:0">
        <span style="font-size:15px">${titleIco(j.titleKey)}</span>
        <b style="font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(jobTitleOf(j))}</b>
      </span>
      <span class="small muted" style="max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(jCo(j))}${j.city?" · "+esc(j.city):""}</span>
    </div>`).join("");
  };
  const likedIds = [...(p.liked || [])];
  const appliedIds = [...(p.applied || [])];
  return `
  <div class="sec-title" style="margin-top:16px"><span class="dot"></span>❤ ${t("likes_section")}</div>
  <div class="card" style="margin-top:8px">
    <div class="small muted" style="margin-bottom:8px">${t("act_hint")}</div>
    ${rows(likedIds, "likes")}
  </div>

  <div class="sec-title" style="margin-top:16px"><span class="dot"></span>📨 ${t("apps_section")}</div>
  <div class="card" style="margin-top:8px">
    <div class="small muted" style="margin-bottom:8px">${t("act_hint")}</div>
    ${rows(appliedIds, "apps")}
  </div>
`;
}
/** #29: پسندیده‌ها/درخواست‌های کاربرِ وارد‌شده روی رکورد خودش ثبت می‌شود
 *  (در اپ اندرویدی: Firestore -> likes|applications/{applicantId}_{jobId}) */
function syncActivity(){
  const id = S.session && S.session.id; if(!id) return;
  const p = S.people.find(x=>x.id===id); if(!p) return;
  p.liked = [...(S.liked||[])]; p.applied = [...(S.applied||[])];
}
/* ==========================================================
   #34 — قفل آگهی‌ها تا پرداخت هزینه (تأیید توسط مدیر)
   وضعیت روی خودِ رکورد متقاضی است: p.pay = "" | "pending" | "paid"
   در اپ اندرویدی همان فیلد روی Firestore → applicants/{uid}.paymentStatus
   ========================================================== */
/** وضعیت پرداخت یک کارجو */
function payOf(p){ return (p && p.pay) || ""; }
/** رکورد کارجوی وارد‌شده (اگر در فهرست نبود، خودِ ورود) */
function meRec(){
  if(!S.session) return null;
  return S.people.find(x=>x.id===S.session.id) || S.session;
}
/** مبلغ نمایش آگهی‌ها (تنظیمات مدیر) */
function adsFeeVal(){ const v=+String(S.adsFee||"").replace(/\D/g,""); return v>0 ? v : DEFAULT_ADS_FEE; }
/** آیا این کاربر می‌تواند آگهی‌ها را ببیند؟ (مدیر همیشه؛ کارجو فقط با پرداخت تأییدشده) */
function userUnlocked(){ return !!(S.isAdmin || payOf(meRec())==="paid"); }
/** کد پیگیری یکتای هر کارجو (کاربر به مدیر می‌گوید، مدیر با آن تأیید می‌کند) */
function trackCode(p){
  const base=String((p&&(p.username||p.id))||"karbama");
  let h=7; for(let i=0;i<base.length;i++) h=(h*31+base.charCodeAt(i))%90000;
  return "KB-"+(10000+h);
}
/** نشان وضعیت پرداخت */
function payBadge(p){
  const st=payOf(p);
  const map={
    "":[ "⛔", t("pay_st_unpaid"), "background:#FEF0F0;border-color:#FFE3ED;color:#B33A18" ],
    "pending":[ "⏳", t("pay_st_pending"), "background:#FFF4DE;border-color:#FDE68A;color:#7A5310" ],
    "paid":[ "✅", t("pay_st_paid"), "background:#E4F7EC;border-color:#A7F3D0;color:#0E7A44" ] };
  const m=map[st]||map[""];
  return `<span class="badge" style="${m[2]}">${m[0]} ${m[1]}</span>`;
}
/** کارجو: «واریز کردم» → وضعیت در انتظار تأیید */
function selectPayMethod(method){
  const me=meRec(); if(!me) return;
  me.payMethod=method; if(S.session && S.session.id===me.id) S.session.payMethod=method;
  persist(); render();
}
function manualReceiptPicked(input){
  const me=meRec(), file=input&&input.files&&input.files[0]; if(!me||!file) return;
  if(!/^image\//.test(file.type)||file.size>5*1024*1024){
    toast("⚠️ "+t("pay_receipt_hint")); input.value=""; return;
  }
  const reader=new FileReader();
  reader.onload=()=>{ me.payReceipt=String(reader.result||""); me.payReceiptName=file.name||"receipt.jpg"; persist(); render(); };
  reader.onerror=()=>toast("⚠️ "+t("pay_receipt_hint"));
  reader.readAsDataURL(file);
}
function requestPay(method="manual"){
  const me=meRec(); if(!me) return;
  // تنها رسید بانکی تا زمان اتصال merchant به پرداختِ در انتظار تأیید می‌رود.
  if(method!=="manual"){ toast("⚙️ "+t("pay_gateway_setup")); return; }
  const raw=String((document.getElementById("manual_ref")||{}).value||me.payReference||"");
  const reference=raw.replace(/[^A-Za-z0-9-]/g,"").slice(0,32);
  if(reference.length<3||!me.payReceipt){ toast("⚠️ "+t("pay_manual_required")); return; }
  me.payMethod="manual"; me.payReference=reference; me.pay="pending"; me.payAt=Date.now();
  if(S.session && S.session.id===me.id){ S.session.pay="pending"; S.session.payMethod="manual"; S.session.payReference=reference; S.session.payReceipt=me.payReceipt; S.session.payReceiptName=me.payReceiptName; }
  persist(); toast("📨 "+t("pay_sent")); go("paid");
}
/** مدیر: تأیید پرداخت */
function adminPayConfirm(id){
  const p=S.people.find(x=>x.id===id); if(!p) return;
  p.pay="paid"; p.payAt=Date.now();
  if(S.session && S.session.id===p.id) S.session.pay="paid";
  persist(); render(); renderOverlay(); toast("✅ "+t("pay_confirmed"));
}
/** مدیر: لغو تأیید پرداخت */
function adminPayCancel(id){
  const p=S.people.find(x=>x.id===id); if(!p) return;
  p.pay=""; p.payAt=0;
  if(S.session && S.session.id===p.id) S.session.pay="";
  persist(); render(); renderOverlay(); toast("↩︎ "+t("pay_unconfirmed"));
}

function saveAdsFee(){
  const v=+String(S.adsFee||"").replace(/\D/g,"");
  S.adsFee=String(v>0?v:DEFAULT_ADS_FEE);
  persist(); render(); toast("✅ "+t("pay_save"));
}

/** مراحل بعدی پرداخت (۱ ثبت شد · ۲ منتظر مدیر · ۳ ادامه‌ی کارجو) */
function paySteps(paid){
  const row=(n,txt,state)=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0">
    <span class="badge" style="flex:0 0 auto;${state==="done"?"background:#E4F7EC;border-color:#A7F3D0;color:#0E7A44":state==="now"?"background:#FFF4DE;border-color:#FDE68A;color:#7A5310":"background:#F1F5F7;border-color:#E3ECF0;color:#57697A"}">${state==="done"?"✅":state==="now"?"⏳":num(n)}</span>
    <span class="small" style="font-weight:700">${txt}</span></div>`;
  return `<div style="height:8px"></div>
    <div class="hr"></div>
    ${row("۱",t("pay_step1"),"done")}
    ${row("۲",t("pay_step2"),paid?"done":"now")}
    ${row("۳",t("pay_step3"),paid?"now":"")}`;
}

  const on=selected===id;
  return `<button onclick="selectPayMethod('${id}')" style="width:100%;text-align:start;border:1px solid ${on?'#0E9F8E':'#E3ECF0'};background:${on?'#E6F7F4':'#FFFFFF'};border-radius:16px;padding:12px;margin:0 0 8px;cursor:pointer;font:inherit;color:#0F1F2B">

    <div class="small muted" style="margin-top:5px;padding-inline-start:31px;line-height:1.75">${note}</div>

}
/** ۲) صفحه‌ی پرداخت v38 — انتخاب سه مسیر؛ درگاه واقعی فقط بعد از merchant+Cloud Functions فعال می‌شود. */
function screenPay(){
  const me=meRec(), st=payOf(me);
  if(st==="pending" || st==="paid") return screenPayDone();
  const method=(me&&me.payMethod)||"manual";
  const choices=`<div class="card">
    <div class="sec-title"><span class="dot"></span>${t("pay_choose_method")}</div>
    ${paymentMethodOption("iran","🇮🇷",t("pay_iran"),t("pay_iran_note"),method)}
    ${paymentMethodOption("turkey","🇹🇷",t("pay_turkey"),t("pay_turkey_note"),method)}
    ${paymentMethodOption("manual","🧾",t("pay_manual"),t("pay_manual_note"),method)}
  </div>`;
  const methodDetail=method==="iran"
    ? `<div class="card"><div class="sec-title"><span class="dot"></span>🇮🇷 ${t("pay_iran")}</div>
         <div class="kv"><span>${t("pay_fee")}</span><b>₺${num(adsFeeVal())}</b></div>
         <p class="small muted" style="line-height:1.95;margin:10px 0 0">${t("pay_rate_note")}</p>
         <p class="small" style="line-height:1.95;margin:8px 0 0;color:#8A5B00">⚙️ ${t("pay_gateway_setup")}</p></div>`
    : method==="turkey"
    ? `<div class="card"><div class="sec-title"><span class="dot"></span>🇹🇷 ${t("pay_turkey")}</div>
         <div class="kv"><span>${t("pay_fee")}</span><b>₺${num(adsFeeVal())}</b></div>
         <p class="small" style="line-height:1.95;margin:10px 0 0;color:#8A5B00">⚙️ ${t("pay_gateway_setup")}</p></div>`
    : `<div class="card"><div class="sec-title"><span class="dot"></span>🧾 ${t("pay_manual")}</div>
         ${payReceiptRows(me)}
         <label class="small" style="display:block;font-weight:900;margin:12px 0 6px">${t("pay_tx_ref")}</label>
         <input id="manual_ref" value="${esc((me&&me.payReference)||"")}" maxlength="32" inputmode="latin" style="width:100%;box-sizing:border-box;border:1px solid #E3ECF0;border-radius:12px;padding:12px;font:inherit;background:#F7FAFB;color:#0F1F2B" />
         <label class="small" style="display:block;font-weight:900;margin:12px 0 6px">${t("pay_receipt_image")}</label>
         <input id="manual_receipt" type="file" accept="image/*" onchange="manualReceiptPicked(this)" style="width:100%;box-sizing:border-box;border:1px solid #E3ECF0;border-radius:12px;padding:10px;background:#F7FAFB" />
         <p class="small muted" style="line-height:1.95;margin:8px 0 0">${t("pay_receipt_hint")}${(me&&me.payReceiptName)?" · ✅ "+esc(me.payReceiptName):""}</p>
         <p class="small muted" style="line-height:1.95;margin:8px 0 0">${t("pay_manual_required")}</p></div>`;
  const body=`${payPageHead()}
    ${choices}
    <div style="height:8px"></div>
    ${methodDetail}
    <div style="height:8px"></div>
    ${method==="manual"
      ? `<button class="btn btn-primary" onclick="requestPay('manual')">🧾 ${t("pay_send")}</button>`
      : `<button class="btn btn-primary" onclick="requestPay('${method}')">💳 ${method==="iran"?t("pay_iran"):t("pay_turkey")}</button>`}
    <div style="height:8px"></div>
    <button class="btn btn-ghost" onclick="go('home')">${t("pay_back")}</button>`;
  return shell({body,tabbar:true});
}
/** ۳) تأییدیه پرداخت + ادامه‌ی مراحل */
function screenPayDone(){
  const me=meRec(), paid=(payOf(me)==="paid");
  const body=`
  ${payPageHead()}
  <div class="card" style="text-align:center">
    <div style="font-size:44px;line-height:1.2">${paid?"✅":"⏳"}</div>
    <h2 style="font-size:16px;font-weight:900;margin:8px 0">${paid?t("pay_confirmed"):t("pay_reg_t")}</h2>
    <div style="margin:0 0 8px">${payBadge(me)}</div>
    <p class="small muted" style="line-height:2;margin:0 0 12px">${paid?t("pay_after_paid"):t("pay_pending_d")}</p>
    <div class="sec-title" style="justify-content:center"><span class="dot"></span>🧾 ${t("pay_receipt")}</div>
    ${payReceiptRows(me)}
    ${paySteps(paid)}
    <div style="height:12px"></div>
    ${paid
      ? `<button class="btn btn-primary" onclick="go('home')">🔓 ${t("pay_open")}</button>`
      : `<button class="btn btn-primary" onclick="recheckPay()">🔄 ${t("pay_recheck")}</button>
         <div style="height:8px"></div>
         <button class="btn btn-ghost" onclick="go('home')">${t("pay_continue")}</button>`}
  </div>`;
  return shell({body,tabbar:true});
}
/** بررسی مجدد وضعیت: اگر مدیر تأیید کرده باشد، آگهی‌ها باز می‌شود */

  toast("⏳ "+t("pay_waiting")); render();

/** آیا داخل قاب پیش‌نمایش هستیم؟ (آنجا مرورگر اجازه‌ی باز کردن لینک بیرونی را نمی‌دهد) */
function inFrame(){ try{ return window.self!==window.top; }catch(e){ return true; } }
/**
 * انتقال به «خودِ برنامه» (تلگرام / واتس‌اپ / اینستاگرام) — نه صفحه‌ی وب.
 * ترتیب کار:
 *   ۱) اسکیم اختصاصی برنامه (tg:// · whatsapp:// · instagram://) از داخل یک iframe پنهان اجرا می‌شود،
 *      پس اگر آن برنامه روی گوشی نصب باشد، همان برنامه باز می‌شود و صفحه‌ی ما دست‌نخورده می‌ماند.
 *   ۲) اگر بعد از ~۰٫۹ ثانیه صفحه هنوز جلوی چشم باشد (یعنی برنامه باز نشده) → لینک وب باز می‌شود.
 * اگر کاربر به برنامه رفته باشد، مرورگر صفحه را «پنهان» می‌کند و ما دیگر هیچ لینکی باز نمی‌کنیم.
 */
function launch(kind, ev){
  const c=CONTACT.find(x=>x.key===kind);
  if(!c) return true;                       // ناشناس → رفتار پیش‌فرض لینک
  if(inFrame()) return true;                // داخل قاب پیش‌نمایش، سندباکس اجازه‌ی باز کردن برنامه نمی‌دهد
  if(ev && ev.preventDefault) ev.preventDefault();

  let wentToApp=false;
  const onVis=()=>{ if(document.hidden || document.visibilityState==="hidden") wentToApp=true; };
  try{ document.addEventListener("visibilitychange", onVis); }catch(e){}
  try{ window.addEventListener("pagehide", ()=>{ wentToApp=true; }, {once:true}); }catch(e){}
  try{ window.addEventListener("blur", ()=>{ setTimeout(()=>{ if(document.hidden) wentToApp=true; },80); }); }catch(e){}

  // ۱) خودِ برنامه
  try{
    const f=document.createElement("iframe");
    f.setAttribute("aria-hidden","true");
    f.style.display="none"; f.style.width="0"; f.style.height="0"; f.style.border="0";
    f.src=c.app;                              // tg:// · whatsapp:// · instagram://
    (document.body||document.documentElement).appendChild(f);
    setTimeout(()=>{ try{ f.remove(); }catch(e){} }, 1600);
  }catch(e){}

  // ۲) وب، فقط اگر برنامه باز نشده باشد
  setTimeout(()=>{
    try{ document.removeEventListener("visibilitychange", onVis); }catch(e){}
    if(wentToApp || document.hidden) return;  // کاربر داخل برنامه است → کاری نکن
    try{ const w=window.open(c.web,"_blank","noopener"); if(w) return; }catch(e){}
    try{ window.location.href=c.web; }catch(e){ copyContact(kind); }
  }, 900);
  return false;
}
/** فراخوانی برنامه‌نویسی‌شده (برای تست) */
function openContact(kind){ return launch(kind, {preventDefault(){}}); }
function copyContact(kind){
  const c=CONTACT.find(x=>x.key===kind); if(!c) return;
  const ok=()=>toast("📋 "+t("contactCopied"));
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(c.web).then(ok).catch(()=>copyFallback(c.web,ok));
      return;
    }
  }catch(e){}
  copyFallback(c.web, ok);
}
function copyFallback(text, ok){
  try{
    const ta=document.createElement("textarea");
    ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    const done=document.execCommand && document.execCommand("copy");
    try{ document.body.removeChild(ta); }catch(e){}
    if(done){ ok(); return; }
  }catch(e){}
  toast(text);   // اگر کپی نشد، خود لینک را نشان بده
}

/* ==========================================================
   نمایش تمام‌صفحه‌ی عکس و ویدیوی آگهی (بزرگ‌نمایی با دو انگشت/دو ضربه)
   ========================================================== */
function mediaL(j){ return (j&&j.media)||[]; }
function openViewer(jobId, i){
  const j=S.jobs.find(x=>x.id===jobId); const L=mediaL(j);
  if(!L.length) return;
  S.view={ jobId:jobId, i:Math.max(0,Math.min(i||0,L.length-1)), zoom:1, ox:0, oy:0 };
  renderViewer();
}
function closeViewer(){ S.view=null; renderViewer(); }
function viewerGo(step){
  if(!S.view) return;
  const L=mediaL(S.jobs.find(x=>x.id===S.view.jobId)); if(!L.length) return;
  S.view.i=(S.view.i+step+L.length)%L.length; S.view.zoom=1; S.view.ox=0; S.view.oy=0;
  renderViewer();
}
function viewerZoom(z, ox, oy){
  if(!S.view) return;
  S.view.zoom=Math.max(1,Math.min(6, z));
  if(S.view.zoom<=1.01){ S.view.ox=0; S.view.oy=0; } else { S.view.ox=ox||0; S.view.oy=oy||0; }
  const im=document.getElementById("vw-media");
  if(im) im.style.transform="translate("+S.view.ox+"px,"+S.view.oy+"px) scale("+S.view.zoom+")";
}
function renderViewer(){
  const el=document.getElementById("viewer"); if(!el) return;
  if(!S.view){ el.className=""; el.innerHTML=""; return; }
  const j=S.jobs.find(x=>x.id===S.view.jobId); const L=mediaL(j); const m=L[S.view.i];
  if(!m){ closeViewer(); return; }
  const isVid=m.t==="v";
  el.className="vw-open";
  el.innerHTML=`
    <div class="vw-top">
      <button class="vw-x" onclick="closeViewer()">✕</button>
      <div class="vw-ttl">${esc(jobTitle(j.titleKey))}<span>${t("mediaTitle")}</span></div>
      <div class="vw-count">${t("mediaIndex",{a:num(S.view.i+1),b:num(L.length)})}</div>
    </div>
    <div class="vw-stage" id="vw-stage">
      ${isVid
        ? `<video id="vw-media" class="vw-video" src="${m.u}" controls autoplay playsinline ${m.p?`poster="${m.p}"`:""}></video>`
        : `<img id="vw-media" class="vw-img" src="${m.u}" alt="">`}
    </div>
    ${L.length>1?`<button class="vw-nav prev" onclick="viewerGo(-1)">‹</button><button class="vw-nav next" onclick="viewerGo(1)">›</button>`:""}
    <div class="vw-hint">${isVid?t("mediaVideoHint"):t("mediaZoomHint")}</div>`;
  bindViewerZoom();
  if(isVid){ const v=document.getElementById("vw-media"); if(v&&v.play) { const pr=v.play(); if(pr&&pr.catch) pr.catch(()=>{}); } }
}
/** بزرگ‌نمایی عکس: چرخ ماوس، دو ضربه، دو انگشت — و کشیدن برای جابه‌جایی */
function bindViewerZoom(){
  const stage=document.getElementById("vw-stage"); const im=document.getElementById("vw-media");
  if(!stage||!im||im.tagName!=="IMG") return;
  let pinch=0, base=1, drag=null;
  stage.onwheel=e=>{ e.preventDefault(); viewerZoom(S.view.zoom*(e.deltaY<0?1.15:0.87)); };
  im.ondblclick=()=>viewerZoom(S.view.zoom>1.5?1:2.6);
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  stage.ontouchstart=e=>{
    if(e.touches.length===2){ pinch=dist(e.touches); base=S.view.zoom; }
    else if(e.touches.length===1){ drag={x:e.touches[0].clientX, y:e.touches[0].clientY, ox:S.view.ox, oy:S.view.oy}; }
  };
  stage.ontouchmove=e=>{
    if(e.touches.length===2&&pinch){ if(e.preventDefault) e.preventDefault(); viewerZoom(base*dist(e.touches)/pinch); }
    else if(e.touches.length===1&&drag&&S.view.zoom>1.02){
      if(e.preventDefault) e.preventDefault();
      viewerZoom(S.view.zoom, drag.ox+(e.touches[0].clientX-drag.x), drag.oy+(e.touches[0].clientY-drag.y));
    }
  };
  stage.ontouchend=e=>{
    if(drag && S.view.zoom<=1.02 && e.changedTouches && e.changedTouches.length){
      const dx=e.changedTouches[0].clientX-drag.x;
      if(Math.abs(dx)>45) viewerGo(dx<0?1:-1);     // کشیدن افقی = رسانه‌ی بعدی/قبلی
    }
    pinch=0; drag=null;
  };
}
/* بستن/جابه‌جایی با صفحه‌کلید */
document.addEventListener("keydown", function(e){
  if(!S.view) return;
  if(e.key==="Escape") closeViewer();
  else if(e.key==="ArrowRight"||e.key==="ArrowLeft") viewerGo(e.key==="ArrowRight"?1:-1);

function initSignature(){
  window.__sigHasInk=false;
  const c=document.getElementById("sigcanvas");
  if(!c || typeof c.getContext!=="function") return;
  try{
    if(typeof c.getBoundingClientRect!=="function") return;
  }catch(e){ return; }
  const box=c.getBoundingClientRect();
  const dpr=Math.min(2.5, window.devicePixelRatio||1);
  c.width=Math.max(300, Math.round(box.width*dpr));
  c.height=Math.max(120, Math.round(150*dpr));
  try{
  const ctx=c.getContext("2d");
  if(!ctx) return;
  ctx.lineWidth=2.2*dpr; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#10303D";
  let drawing=false, last=null;
  const pos=e=>{ const r=c.getBoundingClientRect(); const p=(e.touches&&e.touches[0])||e;
    return { x:(p.clientX-r.left)*(c.width/r.width), y:(p.clientY-r.top)*(c.height/r.height) }; };
  const down=e=>{ drawing=true; last=pos(e); e.preventDefault(); };
  const move=e=>{ if(!drawing) return; const p=pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last=p; window.__sigHasInk=true;
    const h=document.getElementById("sig-hint"); if(h) h.style.display="none";
    e.preventDefault(); };
  const up=()=>{ drawing=false; };
  c.addEventListener("pointerdown",down); c.addEventListener("pointermove",move);
  window.addEventListener("pointerup",up);
  c.addEventListener("touchstart",down,{passive:false});
  c.addEventListener("touchmove",move,{passive:false});
  c.addEventListener("touchend",up);
  window.__sigClear=function(){ ctx.clearRect(0,0,c.width,c.height); window.__sigHasInk=false;
    const h=document.getElementById("sig-hint"); if(h) h.style.display=""; };
  window.__sigToData=function(){ return c.toDataURL("image/png"); };
  }catch(err){ window.__sigHasInk=false; }
}

/* ---------- #22: TOTP (RFC 6238) — همان الگوریتم نسخه‌ی اندروید ---------- */
const B32A="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

    while(bits>=5){ out+=B32A[(val>>>(bits-5))&31]; bits-=5; } }
